<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Padel Replay</title>
  <script src="/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      color: #f0f0f0;
      font-family: 'Helvetica Neue', sans-serif;
      height: 100dvh;
      display: grid;
      grid-template-rows: 52px 1fr 44px;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #0f0f0f;
      border-bottom: 1px solid #1c1c1c;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #facc15;
    }

    .header-right { display: flex; align-items: center; gap: 20px; }

    .rec-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ef4444;
    }
    .rec-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

    .time {
      font-size: 0.75rem;
      color: #444;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    /* ── Main grid ── */
    main {
      display: grid;
      grid-template-columns: 1fr 300px;
      overflow: hidden;
    }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    }

    /* ── Camera feed ── */
    .cam-wrap {
      background: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cam-wrap video {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .cam-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* corner brackets */
    .corner {
      position: absolute;
      width: 22px; height: 22px;
      border-color: rgba(250,204,21,0.5);
      border-style: solid;
    }
    .corner.tl { top:14px; left:14px; border-width:2px 0 0 2px; }
    .corner.tr { top:14px; right:14px; border-width:2px 2px 0 0; }
    .corner.bl { bottom:14px; left:14px; border-width:0 0 2px 2px; }
    .corner.br { bottom:14px; right:14px; border-width:0 2px 2px 0; }

    .cam-label-box {
      position: absolute;
      top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #aaa;
      font-size: 0.65rem;
      letter-spacing: 2px;
      padding: 3px 12px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .no-signal {
      color: #2a2a2a;
      font-size: 0.9rem;
      text-align: center;
      flex-direction: column;
      gap: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Side panel ── */
    .side {
      background: #0c0c0c;
      border-left: 1px solid #181818;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 28px 20px;
    }

    .panel-title {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #444;
    }

    .qr-wrap {
      background: #fff;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(250,204,21,0.08);
    }

    .qr-sub {
      font-size: 0.8rem;
      color: #555;
      text-align: center;
      line-height: 1.6;
    }

    .qr-url {
      font-size: 0.6rem;
      color: #333;
      text-align: center;
      word-break: break-all;
      max-width: 200px;
    }

    .divider {
      width: 80%;
      height: 1px;
      background: #1a1a1a;
    }

    .clip-counter {
      text-align: center;
    }
    .clip-counter .num {
      font-size: 2.8rem;
      font-weight: 700;
      color: #facc15;
      line-height: 1;
    }
    .clip-counter .lbl {
      font-size: 0.65rem;
      color: #444;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Footer ── */
    footer {
      background: #0f0f0f;
      border-top: 1px solid #1c1c1c;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 0.7rem;
      color: #3a3a3a;
      flex-shrink: 0;
    }

    .stat strong { color: #666; margin-left: 5px; }

    .ws-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #333;
      transition: background 0.3s;
    }
    .ws-dot.on { background: #22c55e; }
  </style>
</head>
<body>

  <!-- แสดงเมื่อยังไม่ start -->
  <div id="setup-banner" style="display:none; background:#1a0f00; border-bottom:1px solid #facc1555;
    padding:10px 20px; text-align:center; font-size:0.8rem; color:#facc15;">
    ⚠️ ระบบยังไม่เริ่มอัด —
    <a href="/setup" style="color:#facc15; font-weight:700; text-decoration:underline;">ไปหน้า Setup</a>
    เพื่อเลือกกล้องและเริ่มระบบ
  </div>

  <header>
    <div class="logo">🎾 KROSS PADEL</div>
    <div class="header-right">
      <div class="time" id="clock">--:--:--</div>
      <div class="rec-badge">
        <div class="rec-dot"></div>
        <span>REC</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Camera feed -->
    <div class="cam-wrap" id="cam-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <div class="cam-overlay">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="cam-label-box" id="cam-label">CAM 1</div>
      </div>
    </div>

    <!-- Side panel -->
    <div class="side">
      <div class="panel-title">📱 Remote Control</div>

      <div class="qr-wrap">
        <div id="qr-canvas"></div>
      </div>
      <div class="qr-sub">สแกนเพื่อควบคุม<br>จากมือถือ</div>
      <div class="qr-url" id="qr-url"></div>

      <div class="divider"></div>

      <div class="clip-counter">
        <div class="num" id="clip-num">0</div>
        <div class="lbl">คลิปวันนี้</div>
      </div>
    </div>
  </main>

  <footer>
    <div class="stat">กล้อง:<strong id="stat-cam">—</strong></div>
    <div class="stat">เซสชัน:<strong id="stat-session">—</strong></div>
    <div class="stat">IP:<strong id="stat-ip">—</strong></div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <div class="ws-dot" id="ws-dot"></div>
      <span id="ws-label">กำลังเชื่อมต่อ...</span>
    </div>
  </footer>

  <script>
    // ── Camera info from setup ───────────────────────────────────────────────
    const camName  = sessionStorage.getItem('camName')   || 'CAM';
    const camIndex = sessionStorage.getItem('camIndex')  || '0';
    const camDevId = sessionStorage.getItem('camDevId')  || null;
    const session  = sessionStorage.getItem('session')   || '';

    document.getElementById('stat-cam').textContent  = `${camName} [${camIndex}]`;
    document.getElementById('cam-label').textContent = `CAM ${camIndex}  —  ${camName}`;
    if (session) document.getElementById('stat-session').textContent = session;

    // ── Clock ────────────────────────────────────────────────────────────────
    function tick() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('th-TH', { hour12: false });
    }
    tick();
    setInterval(tick, 1000);

    // ── QR Code ──────────────────────────────────────────────────────────────
    async function initQR() {
      let url;
      try {
        const res = await fetch('/info');
        const { ip, port } = await res.json();
        url = `http://${ip}:${port}/operator`;
        document.getElementById('stat-ip').textContent = ip;
      } catch {
        url = `${location.origin}/operator`;
      }
      document.getElementById('qr-url').textContent = url;
      new QRCode(document.getElementById('qr-canvas'), {
        text: url, width: 200, height: 200,
        colorDark: '#000000', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
    }
    initQR();

    // ── ตรวจสอบว่า recording เริ่มแล้วหรือยัง ───────────────────────────────
    fetch('/status').then(r => r.json()).then(({ started }) => {
      if (!started) document.getElementById('setup-banner').style.display = 'block';
    });

    // ── Camera preview (getUserMedia) ────────────────────────────────────────
    async function startPreview() {
      const video = document.getElementById('cam-video');
      try {
        const constraints = camDevId
          ? { video: { deviceId: { exact: camDevId } } }
          : { video: true };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch {
        video.style.display = 'none';
        document.getElementById('cam-wrap').innerHTML =
          '<div class="no-signal">📷<br>ไม่สามารถแสดงภาพกล้อง</div>';
      }
    }
    startPreview();

    // ── WebSocket: clip counter + connection status ───────────────────────────
    const wsDot   = document.getElementById('ws-dot');
    const wsLabel = document.getElementById('ws-label');
    const clipNum = document.getElementById('clip-num');
    let clips = 0;

    let reconnectTimer = null;
    function connect() {
      const ws = new WebSocket(`ws://${location.host}/ws`);
      let pingTimer = null;

      ws.onopen = () => {
        wsDot.className     = 'ws-dot on';
        wsLabel.textContent = 'เชื่อมต่อแล้ว';
        pingTimer = setInterval(() => ws.readyState === 1 && ws.send('ping'), 20000);
      };

      ws.onmessage = ({ data }) => {
        const msg = JSON.parse(data);
        if (msg.event === 'replay_ready') {
          clips++;
          clipNum.textContent = clips;
          clipNum.style.color = '#22c55e';
          setTimeout(() => clipNum.style.color = '#facc15', 600);
        }
      };

      ws.onerror = () => {}; // onclose จะจัดการต่อ

      ws.onclose = () => {
        clearInterval(pingTimer);
        wsDot.className     = 'ws-dot';
        wsLabel.textContent = 'ขาดการเชื่อมต่อ...';
        if (!reconnectTimer) {
          reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 3000);
        }
      };
    }
    connect();
  </script>
</body>
</html>
