<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup — Padel Replay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0d0d0d; color: #f0f0f0;
      font-family: 'Helvetica Neue', sans-serif;
      min-height: 100dvh; padding: 40px 24px;
      display: flex; flex-direction: column; align-items: center;
    }
    .logo {
      font-size: 0.85rem; font-weight: 600; letter-spacing: 4px;
      text-transform: uppercase; color: #8a8a8a; margin-bottom: 6px;
    }
    .subtitle { font-size: 0.8rem; color: #555; margin-bottom: 28px; }

    .panel {
      width: 100%; max-width: 760px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .row-top {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
    label.fld { font-size: 0.72rem; color: #777; letter-spacing: 1px; }
    input, select {
      width: 100%; padding: 12px 14px;
      background: #0d0d0d; color: #f0f0f0;
      border: 2px solid #333; border-radius: 10px;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #ececec; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px; border-radius: 12px;
      border: 2px solid #ececec; background: #1a1a1a; color: #ececec;
      font-size: 0.95rem; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; transition: transform 0.1s, background 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.green { border-color: #22c55e; background: #0a1f0a; color: #22c55e; }
    .btn.ghost { border-color: #333; background: transparent; color: #999; }
    .btn.sm { padding: 9px 14px; font-size: 0.8rem; }

    .courts { display: flex; flex-direction: column; gap: 14px; }
    .court-card {
      background: #111; border: 1px solid #222; border-radius: 14px;
      padding: 18px; display: flex; flex-direction: column; gap: 14px;
    }
    .court-card .head {
      display: flex; align-items: center; justify-content: space-between;
    }
    .court-card .head .tag {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 2px;
      color: #ececec; text-transform: uppercase;
    }
    .grid3 { display: grid; grid-template-columns: 100px 1fr 1fr; gap: 12px; }
    @media (max-width: 560px) { .grid3 { grid-template-columns: 1fr; } }
    .del { color: #ef4444; cursor: pointer; font-size: 0.8rem; background: none; border: none; }

    .actions { display: flex; gap: 12px; margin-top: 6px; }
    .actions .btn { flex: 1; }

    .error-chip {
      background: #1f0a0a; border: 1px solid #ef4444; color: #ef4444;
      border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; display: none;
    }
    .hint { font-size: 0.78rem; color: #555; line-height: 1.6; }
    #scan-card { background:#111; border:1px solid #222; border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:16px; }
  </style>
</head>
<body>
  <div class="logo">🎾 Padel Replay</div>
  <div class="subtitle">Set up multiple courts at once — the system remembers them</div>

  <div class="panel">
    <!-- Step 1: scan -->
    <div id="scan-card">
      <div class="field">
        <label class="fld">Session name (optional — used to organize folders on Drive)</label>
        <input id="session" type="text" placeholder="e.g. 2026-06-07 evening" maxlength="60" />
      </div>
      <p class="hint">Connect all cameras (USB / IP), then scan — live preview is available on the Dashboard after starting</p>
      <div class="error-chip" id="scan-err">No cameras found — check the connections and try again</div>
      <button class="btn" id="btn-scan" onclick="scan()">🔍 Scan for cameras</button>
    </div>

    <!-- Step 2: courts builder -->
    <div id="builder" style="display:none; flex-direction:column; gap:18px;">
      <div class="courts" id="courts"></div>
      <button class="btn ghost sm" onclick="addCourt()" style="align-self:flex-start">+ Add court</button>
      <div class="error-chip" id="start-err"></div>
      <div class="actions">
        <button class="btn green" id="btn-start" onclick="startAll()">▶ Start all</button>
      </div>
    </div>
  </div>

  <script>
    let cameras = [];          // [{index,name}]
    let courtSeq = 0;
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

    async function scan() {
      const btn = document.getElementById('btn-scan');
      btn.disabled = true; btn.textContent = '⏳ Scanning...';
      document.getElementById('scan-err').style.display = 'none';
      try {
        // ขอ permission กล้อง (ช่วยให้ enumerate เสถียร) — ไม่บังคับ
        try { const t = await navigator.mediaDevices.getUserMedia({ video: true }); t.getTracks().forEach(x => x.stop()); } catch {}
        const data = await (await fetch('/cameras')).json();
        cameras = data.cameras || [];
        if (!cameras.length) throw new Error('no cameras');
        document.getElementById('scan-card').style.display = 'none';
        document.getElementById('builder').style.display = 'flex';
        addCourt();   // เริ่มด้วย 1 คอร์ท
      } catch (e) {
        document.getElementById('scan-err').style.display = 'block';
        btn.disabled = false; btn.textContent = '🔍 Scan again';
      }
    }

    function addCourt() {
      const i = courtSeq++;
      const id = LETTERS[i] || String(i + 1);
      const card = document.createElement('div');
      card.className = 'court-card';
      card.dataset.row = i;
      card.innerHTML = `
        <div class="head">
          <span class="tag">Court</span>
          <button class="del" onclick="this.closest('.court-card').remove()">✕ Remove</button>
        </div>
        <div class="grid3">
          <div class="field">
            <label class="fld">ID</label>
            <input class="c-id" value="${id}" maxlength="6" />
          </div>
          <div class="field">
            <label class="fld">Display name</label>
            <input class="c-name" value="Court ${id}" maxlength="40" />
          </div>
          <div class="field">
            <label class="fld">Camera</label>
            <select class="c-cam"></select>
          </div>
        </div>
        <div class="field c-rtsp-wrap" style="display:none">
          <label class="fld">Auto-discover CCTV camera (ONVIF)</label>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
            <button type="button" class="btn sm ghost btn-scan-cctv" onclick="scanCctv(this)">🔍 Find cameras on network</button>
            <select class="c-onvif" style="flex:1; min-width:160px; display:none"></select>
          </div>
          <div class="c-cred" style="display:none; gap:8px; flex-wrap:wrap; margin-top:8px">
            <input class="c-user" style="flex:1; min-width:120px" placeholder="ONVIF user (e.g. admin)" />
            <input class="c-pass" type="password" style="flex:1; min-width:120px" placeholder="ONVIF password" />
            <button type="button" class="btn sm" onclick="fetchCctvRtsp(this)">📡 Get link</button>
          </div>
          <div class="c-cctv-msg" style="font-size:0.78rem; color:#888; margin-top:6px"></div>
          <label class="fld" style="margin-top:8px">RTSP URL (IP / CCTV camera)</label>
          <input class="c-rtsp" placeholder="rtsp://user:pass@192.168.100.60:554/stream1" />
        </div>
        <div class="field">
          <label class="fld">Resolution / frame rate</label>
          <select class="c-fmt"><option>— Select a camera first —</option></select>
        </div>`;
      const camSel = card.querySelector('.c-cam');
      cameras.forEach((c, idx) => {
        const o = document.createElement('option');
        o.value = c.index; o.textContent = c.name;
        camSel.appendChild(o);
      });
      const ro = document.createElement('option');
      ro.value = '__rtsp__'; ro.textContent = '📡 IP / CCTV camera (RTSP)…';
      camSel.appendChild(ro);
      camSel.onchange = () => loadFormats(card, camSel.value);
      document.getElementById('courts').appendChild(card);
      // เลือกกล้องตัวถัดไปให้อัตโนมัติ (กันเลือกซ้ำ) แล้วโหลด format
      const used = [...document.querySelectorAll('.c-cam')].slice(0, -1).map(s => s.value);
      const free = cameras.find(c => !used.includes(c.index));
      if (free) camSel.value = free.index;
      loadFormats(card, camSel.value);
    }

    const RTSP_MODES = [
      { width:1920, height:1080, fps:30, label:'1920×1080 · 30fps' },
      { width:1280, height:720, fps:30, label:'1280×720 · 30fps' },
      { width:854, height:480, fps:30, label:'854×480 · 30fps' },
    ];

    async function loadFormats(card, device) {
      const sel = card.querySelector('.c-fmt');
      const rtspWrap = card.querySelector('.c-rtsp-wrap');
      // กล้อง IP (RTSP) — ไม่ probe, ให้เลือกจากชุดมาตรฐาน + โชว์ช่อง URL
      if (device === '__rtsp__') {
        rtspWrap.style.display = 'flex';
        sel.innerHTML = '';
        RTSP_MODES.forEach(m => {
          const o = document.createElement('option');
          o.value = JSON.stringify({ width:m.width, height:m.height, fps:m.fps });
          o.textContent = m.label;
          sel.appendChild(o);
        });
        return;
      }
      rtspWrap.style.display = 'none';
      sel.innerHTML = '<option>⏳ Checking...</option>';
      try {
        const data = await (await fetch(`/camera-formats?device=${encodeURIComponent(device)}`)).json();
        const modes = (data.modes && data.modes.length) ? data.modes
                      : [{ width:1280, height:720, fps:30, label:'1280×720 · 30fps (default)' }];
        sel.innerHTML = '';
        modes.forEach((m, idx) => {
          const o = document.createElement('option');
          o.value = JSON.stringify({ width:m.width, height:m.height, fps:m.fps });
          o.textContent = m.label || `${m.width}×${m.height} · ${m.fps}fps`;
          sel.appendChild(o);
        });
      } catch {
        sel.innerHTML = '<option value=\'{"width":1280,"height":720,"fps":30}\'>1280×720 · 30fps</option>';
      }
    }

    // ── ค้นหากล้อง CCTV (ONVIF) + ดึง RTSP URL อัตโนมัติ ──
    async function scanCctv(btn) {
      const wrap = btn.closest('.c-rtsp-wrap');
      const sel  = wrap.querySelector('.c-onvif');
      const msg  = wrap.querySelector('.c-cctv-msg');
      btn.disabled = true; const orig = btn.textContent; btn.textContent = '⏳ Searching...';
      msg.style.color = '#888'; msg.textContent = 'Scanning network (~4s)...';
      try {
        const data = await (await fetch('/scan-cctv')).json();
        const cams = data.cameras || [];
        if (!cams.length) { msg.style.color = '#ef4444'; msg.textContent = '❌ No ONVIF cameras found on network'; return; }
        sel.innerHTML = '<option value="">— Select a found camera —</option>';
        cams.forEach(c => {
          const o = document.createElement('option');
          o.value = c.xaddr; o.dataset.ip = c.ip;
          o.textContent = `${c.name || c.ip} (${c.ip})`;
          sel.appendChild(o);
        });
        sel.style.display = 'block';
        wrap.querySelector('.c-cred').style.display = 'flex';
        msg.style.color = '#22c55e';
        msg.textContent = `✅ Found ${cams.length} camera(s) — select one and enter ONVIF credentials`;
      } catch {
        msg.style.color = '#ef4444'; msg.textContent = '❌ Scan failed';
      } finally { btn.disabled = false; btn.textContent = orig; }
    }

    async function fetchCctvRtsp(btn) {
      const wrap = btn.closest('.c-rtsp-wrap');
      const sel  = wrap.querySelector('.c-onvif');
      const msg  = wrap.querySelector('.c-cctv-msg');
      const opt  = sel.selectedOptions[0];
      const xaddr = sel.value;
      const ip    = opt ? opt.dataset.ip : '';
      const user  = wrap.querySelector('.c-user').value.trim();
      const password = wrap.querySelector('.c-pass').value;
      if (!xaddr) { msg.style.color = '#ef4444'; msg.textContent = '⚠️ Select a camera first'; return; }
      if (!user)  { msg.style.color = '#ef4444'; msg.textContent = '⚠️ Enter ONVIF user/password'; return; }
      btn.disabled = true; const orig = btn.textContent; btn.textContent = '⏳...';
      msg.style.color = '#888'; msg.textContent = 'Requesting link from camera...';
      try {
        const res = await fetch('/cctv-rtsp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ xaddr, user, password, ip }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed to get link');
        wrap.querySelector('.c-rtsp').value = data.url;
        msg.style.color = '#22c55e'; msg.textContent = '✅ Got RTSP link — ready to start';
      } catch (e) {
        msg.style.color = '#ef4444'; msg.textContent = '❌ ' + e.message;
      } finally { btn.disabled = false; btn.textContent = orig; }
    }

    async function startAll() {
      const cards = [...document.querySelectorAll('.court-card')];
      if (!cards.length) return;
      const btn = document.getElementById('btn-start');
      const err = document.getElementById('start-err');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = '⏳ Starting...';
      const session = document.getElementById('session').value.trim();

      const fails = [];
      for (const card of cards) {
        const id = card.querySelector('.c-id').value.trim();
        const name = card.querySelector('.c-name').value.trim();
        let device = card.querySelector('.c-cam').value;
        let fmt = { width:1280, height:720, fps:30 };
        try { fmt = JSON.parse(card.querySelector('.c-fmt').value); } catch {}
        if (!id) { fails.push('(missing court ID)'); continue; }
        if (device === '__rtsp__') {
          device = card.querySelector('.c-rtsp').value.trim();
          if (!/^rtsps?:\/\//.test(device)) { fails.push(`${id}: invalid RTSP URL`); continue; }
        }
        try {
          const res = await fetch('/courts', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, name, device, fps: fmt.fps, width: fmt.width, height: fmt.height, session }),
          });
          if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || 'Cannot open camera'); }
        } catch (e) {
          fails.push(`${id}: ${e.message}`);
        }
      }

      if (fails.length) {
        err.textContent = '⚠️ Some courts failed to start — ' + fails.join(' · ');
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = '▶ Try starting again';
        // ถ้ามีบางคอร์ทสำเร็จก็ยังไป dashboard ได้
        setTimeout(() => location.href = '/dashboard', 2500);
        return;
      }
      btn.textContent = '✅ Done';
      location.href = '/dashboard';
    }
  </script>
</body>
</html>
