<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Setup — Padel Replay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Helvetica Neue', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 24px 40px;
      gap: 0;
    }

    /* ── header ── */
    .logo {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 32px;
    }

    /* ── step indicators ── */
    .steps {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 40px;
    }
    .step-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #333;
      background: #111;
      color: #555;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }
    .step-dot.active  { border-color: #facc15; color: #facc15; }
    .step-dot.done    { border-color: #22c55e; background: #22c55e; color: #000; }
    .step-line {
      width: 48px;
      height: 2px;
      background: #222;
      transition: background 0.3s;
    }
    .step-line.done { background: #22c55e; }

    /* ── card ── */
    .card {
      width: 100%;
      max-width: 480px;
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .card p {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.6;
    }

    /* ── buttons ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 12px;
      border: 2px solid #facc15;
      background: #1a1500;
      color: #facc15;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.1s, background 0.1s;
      width: 100%;
    }
    .btn:active { transform: scale(0.97); background: #2a2000; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn.green {
      border-color: #22c55e;
      background: #0a1f0a;
      color: #22c55e;
    }
    .btn.green:active { background: #0f2d0f; }

    /* ── camera list ── */
    .camera-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .camera-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 2px solid #222;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .camera-item:hover   { border-color: #444; }
    .camera-item.selected { border-color: #facc15; background: #1a1500; }
    .camera-item input[type=radio] { accent-color: #facc15; width: 18px; height: 18px; }
    .camera-name { font-size: 0.95rem; font-weight: 600; }
    .camera-idx  { font-size: 0.75rem; color: #555; margin-top: 2px; }

    /* ── format chips ── */
    .format-section { display: none; flex-direction: column; gap: 10px; }
    .format-title {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 1px;
    }
    .format-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 8px 14px;
      border: 2px solid #222;
      border-radius: 8px;
      background: #0d0d0d;
      color: #aaa;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: #444; }
    .chip.selected {
      border-color: #facc15;
      background: #1a1500;
      color: #facc15;
    }

    /* ── preview ── */
    .preview-box {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      border: 1px solid #222;
      position: relative;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .preview-label {
      position: absolute;
      top: 10px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      color: #22c55e;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .preview-placeholder {
      color: #333;
      font-size: 0.9rem;
      text-align: center;
      position: absolute;
    }

    /* ── done screen ── */
    .done-icon {
      font-size: 4rem;
      text-align: center;
    }
    .done-title {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      color: #22c55e;
    }
    .done-sub {
      font-size: 0.85rem;
      color: #555;
      text-align: center;
    }

    /* ── error chip ── */
    .error-chip {
      background: #1f0a0a;
      border: 1px solid #ef4444;
      color: #ef4444;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="logo">🎾 Padel Replay</div>

  <!-- Step indicators -->
  <div class="steps">
    <div class="step-dot active" id="dot-1">1</div>
    <div class="step-line" id="line-1"></div>
    <div class="step-dot" id="dot-2">2</div>
    <div class="step-line" id="line-2"></div>
    <div class="step-dot" id="dot-3">3</div>
  </div>

  <!-- Step 1: ค้นหากล้อง -->
  <div class="card" id="step-1">
    <h2>📷 เชื่อมต่อกล้อง</h2>
    <p>ตั้งชื่อเซสชัน แล้วต่อสาย USB กล้องให้เรียบร้อย</p>

    <input id="session-name" type="text" placeholder="เช่น Court A · Match 1"
      maxlength="60"
      style="width:100%; padding:14px 16px; border-radius:10px; border:2px solid #333;
             background:#0d0d0d; color:#f0f0f0; font-size:1rem; outline:none;
             transition:border-color 0.2s;"
      onfocus="this.style.borderColor='#facc15'"
      onblur="this.style.borderColor='#333'" />

    <div class="error-chip" id="err-1">ไม่พบกล้อง — ลองเสียบสายใหม่แล้วค้นหาอีกครั้ง</div>
    <button class="btn" id="btn-scan" onclick="scanCameras()">🔍 ค้นหากล้อง</button>
  </div>

  <!-- Step 2: เลือกกล้อง + preview -->
  <div class="card" id="step-2" style="display:none">
    <h2>🎥 เลือกกล้อง</h2>
    <div class="camera-list" id="camera-list"></div>

    <div class="format-section" id="format-section">
      <div class="format-title">⚙️ ความละเอียด / เฟรมเรท</div>
      <div class="format-chips" id="format-chips"></div>
    </div>

    <div class="preview-box" id="preview-box">
      <div class="preview-placeholder" id="preview-placeholder">เลือกกล้องเพื่อดูตัวอย่าง</div>
      <video id="preview-video" autoplay playsinline muted style="display:none"></video>
      <div class="preview-label" style="display:none" id="preview-label">● LIVE</div>
    </div>

    <div class="error-chip" id="err-2">กล้องไม่ตอบสนอง — ลองกล้องอื่น</div>
    <button class="btn" id="btn-start" onclick="startSystem()" disabled>▶ เริ่มระบบ</button>
  </div>

  <!-- Step 3: Done -->
  <div class="card" id="step-3" style="display:none">
    <div class="done-icon">✅</div>
    <div class="done-title">ระบบพร้อมแล้ว</div>
    <p class="done-sub">กล้อง <strong id="done-cam"></strong> กำลังบันทึก</p>
    <button class="btn green" onclick="location.href='/dashboard'">ไปหน้า Dashboard →</button>
  </div>

  <script>
    let selectedDevice  = null;
    let selectedName    = null;
    let selectedFormat  = null;   // { width, height, fps }
    let currentStream   = null;
    let browserCameras  = [];
    const videoEl       = document.getElementById('preview-video');

    // ── Step indicators ──────────────────────────────────────────────────────
    function setStep(n) {
      [1, 2, 3].forEach(i => {
        const dot  = document.getElementById(`dot-${i}`);
        const line = document.getElementById(`line-${i}`);
        dot.className  = 'step-dot' + (i < n ? ' done' : i === n ? ' active' : '');
        if (line) line.className = 'step-line' + (i < n ? ' done' : '');
        document.getElementById(`step-${i}`).style.display = (i === n) ? 'flex' : 'none';
      });
    }

    // ── Step 1: Scan cameras ─────────────────────────────────────────────────
    async function scanCameras() {
      const btn = document.getElementById('btn-scan');
      btn.disabled = true;
      btn.textContent = '⏳ กำลังค้นหา...';
      document.getElementById('err-1').style.display = 'none';

      try {
        // ขอ permission ก่อน เพื่อให้ enumerateDevices คืน label
        const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
        tmp.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        browserCameras = devices.filter(d => d.kind === 'videoinput');

        // ดึง ffmpeg device list เพื่อเอา index สำหรับ recording
        const res  = await fetch('/cameras');
        const data = await res.json();

        if (!browserCameras.length && !data.cameras.length) {
          throw new Error('no cameras');
        }

        buildCameraList(data.cameras);
        setStep(2);
      } catch (e) {
        document.getElementById('err-1').style.display = 'block';
        btn.disabled = false;
        btn.textContent = '🔍 ค้นหาอีกครั้ง';
      }
    }

    // ── Step 2: Build camera list ────────────────────────────────────────────
    function buildCameraList(ffmpegCams) {
      const list = document.getElementById('camera-list');
      list.innerHTML = '';
      ffmpegCams.forEach(cam => {
        const item = document.createElement('div');
        item.className = 'camera-item';
        item.innerHTML = `
          <input type="radio" name="cam" value="${cam.index}" id="cam-${cam.index}" />
          <label for="cam-${cam.index}" style="cursor:pointer;flex:1">
            <div class="camera-name">${cam.name}</div>
            <div class="camera-idx">กล้อง [${cam.index}]</div>
          </label>`;
        item.onclick = () => selectCamera(cam.index, cam.name, item);
        list.appendChild(item);
      });
      // auto-select first
      const first = ffmpegCams[0];
      if (first) selectCamera(first.index, first.name, list.querySelector('.camera-item'));
    }

    let selectGen = 0;       // กันคลิกซ้อน: เฉพาะ gen ล่าสุดเท่านั้นที่ทำงาน
    let switching = false;    // กันคลิกรัวขณะกำลังสลับ

    async function selectCamera(index, name, itemEl) {
      const gen = ++selectGen;

      // ไฮไลต์ทันที + ปิดปุ่มเริ่ม
      document.querySelectorAll('.camera-item').forEach(el => el.classList.remove('selected'));
      itemEl.classList.add('selected');
      itemEl.querySelector('input').checked = true;
      selectedDevice = index;
      selectedName   = name;
      document.getElementById('err-2').style.display = 'none';
      document.getElementById('btn-start').disabled = true;

      // ปล่อยกล้องเดิมก่อนเสมอ เพื่อไม่ให้แย่งกัน
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      await loadFormats(index, gen);
      if (gen !== selectGen) return;   // ผู้ใช้คลิกกล้องอื่นไปแล้ว
      await loadPreview(name, gen);
    }

    // ── โหลดความละเอียด/เฟรมเรทที่กล้องรองรับ ───────────────────────────────
    async function loadFormats(device, gen) {
      const section = document.getElementById('format-section');
      const chips   = document.getElementById('format-chips');
      chips.innerHTML = '<span style="color:#555;font-size:0.8rem">⏳ กำลังตรวจสอบ...</span>';
      section.style.display = 'flex';
      selectedFormat = null;

      try {
        const res  = await fetch(`/camera-formats?device=${device}`);
        const data = await res.json();
        if (gen !== selectGen) return;   // ผลลัพธ์เก่า ทิ้งไป

        if (!data.modes.length) {
          selectedFormat = { width: 1280, height: 720, fps: 30 };
          section.style.display = 'none';
          document.getElementById('btn-start').disabled = false;
          return;
        }

        chips.innerHTML = '';
        data.modes.forEach((mode, i) => {
          const chip = document.createElement('div');
          chip.className = 'chip';
          chip.textContent = mode.label;
          chip.onclick = () => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            selectedFormat = { width: mode.width, height: mode.height, fps: mode.fps };
            document.getElementById('btn-start').disabled = false;
          };
          chips.appendChild(chip);
          if (i === 0) chip.click();
        });
      } catch {
        if (gen !== selectGen) return;
        selectedFormat = { width: 1280, height: 720, fps: 30 };
        section.style.display = 'none';
        document.getElementById('btn-start').disabled = false;
      }
    }

    async function loadPreview(cameraName, gen) {
      const placeholder = document.getElementById('preview-placeholder');
      const label       = document.getElementById('preview-label');

      videoEl.style.display     = 'none';
      label.style.display       = 'none';
      placeholder.textContent   = '⏳ กำลังโหลด...';
      placeholder.style.display = 'block';

      try {
        const keyword = cameraName.toLowerCase().split(' ')[0];
        const match   = browserCameras.find(d => d.label.toLowerCase().includes(keyword));
        const constraints = match
          ? { video: { deviceId: { exact: match.deviceId } } }
          : { video: true };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);

        // ถ้าระหว่างรอ ผู้ใช้สลับไปกล้องอื่นแล้ว ให้ทิ้ง stream นี้
        if (gen !== selectGen) {
          stream.getTracks().forEach(t => t.stop());
          return;
        }

        currentStream = stream;
        if (match) sessionStorage.setItem('camDevId', match.deviceId);
        videoEl.srcObject = currentStream;
        await videoEl.play();

        placeholder.style.display = 'none';
        videoEl.style.display     = 'block';
        label.style.display       = 'block';
      } catch {
        if (gen !== selectGen) return;
        placeholder.textContent   = '⚠️ ไม่สามารถเปิดกล้องได้';
        placeholder.style.display = 'block';
        document.getElementById('err-2').style.display = 'block';
      }
    }

    // ── Step 3: Start recording ──────────────────────────────────────────────
    async function startSystem() {
      const btn = document.getElementById('btn-start');
      btn.disabled = true;
      btn.textContent = '⏳ กำลังเริ่ม...';

      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      const fmt = selectedFormat || { width: 1280, height: 720, fps: 30 };
      try {
        const session = document.getElementById('session-name').value.trim() ||
                        new Date().toLocaleDateString('th-TH');
        const params = new URLSearchParams({
          device: selectedDevice,
          session,
          framerate: fmt.fps,
          width: fmt.width,
          height: fmt.height,
        });
        const res = await fetch(`/start?${params}`, { method: 'POST' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || 'เริ่มระบบไม่สำเร็จ');
        }

        // เซฟข้อมูลกล้องสำหรับ dashboard
        sessionStorage.setItem('camName',  selectedName);
        sessionStorage.setItem('camIndex', selectedDevice);
        sessionStorage.setItem('session',  session);

        document.getElementById('done-cam').textContent =
          `${selectedName} [${selectedDevice}] · ${fmt.width}×${fmt.height}@${fmt.fps}fps`;
        setStep(3);
        setTimeout(() => location.href = '/dashboard', 1500);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '▶ เริ่มระบบ';
        const chip = document.getElementById('err-2');
        chip.textContent = '⚠️ ' + (e.message || 'เปิดกล้องไม่ได้ — ลองโหมดอื่น');
        chip.style.display = 'block';
      }
    }
  </script>
</body>
</html>
